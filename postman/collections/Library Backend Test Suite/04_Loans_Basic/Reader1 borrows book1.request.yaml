$kind: http-request
url: "{{baseUrl}}/api/loans"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{readerToken}}
body:
  type: json
  content: '{"book_id":{{book1Id}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Loan is ACTIVE', () => pm.expect(b.status).to.eql('ACTIVE'));
      pm.collectionVariables.set('loan1Id', b.id);
    language: text/javascript
order: 1000
