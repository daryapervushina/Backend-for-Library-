$kind: http-request
name: GET /api/books?available=true
url: "{{baseUrl}}/api/books?available=true"
method: GET
queryParams:
  available: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('All items have available_copies > 0', () => {
        b.items.forEach(i => pm.expect(i.available_copies).to.be.greaterThan(0));
      });
    language: text/javascript
order: 2000
