$kind: http-request
url: "{{baseUrl}}/api/users/{{readerId}}/loans?filter=active"
method: GET
headers:
  Authorization: Bearer {{readerToken}}
queryParams:
  filter: active
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Array', () => pm.expect(b).to.be.an('array'));
      pm.test('Only active', () => b.forEach(l => pm.expect(l.is_overdue).to.be.a('boolean')));
    language: text/javascript
order: 3000
