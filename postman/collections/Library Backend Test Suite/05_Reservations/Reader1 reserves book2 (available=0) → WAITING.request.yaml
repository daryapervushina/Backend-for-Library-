$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{readerToken}}
body:
  type: json
  content: '{"book_id":{{book2Id}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Status WAITING', () => pm.expect(b.status).to.eql('WAITING'));
      pm.collectionVariables.set('reservation1Id', b.id);
    language: text/javascript
order: 2000
