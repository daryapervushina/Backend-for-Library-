$kind: http-request
url: "{{baseUrl}}/api/loans"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{reader2Token}}
body:
  type: json
  content: '{"book_id":{{book2Id}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('loan2Id', pm.response.json().id);
    language: text/javascript
order: 1000
