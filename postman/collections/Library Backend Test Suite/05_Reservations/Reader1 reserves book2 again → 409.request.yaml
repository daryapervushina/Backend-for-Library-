$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{readerToken}}
body:
  type: json
  content: '{"book_id":{{book2Id}}}'
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
