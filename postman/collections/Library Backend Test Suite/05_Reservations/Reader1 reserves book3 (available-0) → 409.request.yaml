$kind: http-request
name: Reader1 reserves book3 (available>0) → 409
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{readerToken}}
body:
  type: json
  content: '{"book_id":{{book3Id}}}'
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
