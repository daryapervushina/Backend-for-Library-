$kind: collection
description: |-
  Автотесты основных сценариев backend-сервиса «Библиотека / книжный клуб».

  Перед запуском:
  1) Сервис запущен, baseUrl корректен.
  2) БД пустая (или хотя бы нет книг с ISBN 9780547928227).
  3) В БД есть библиотекарь lib@example.com / Password123! (сид).
  4) Запускать Collection Runner сверху вниз: 00 → 01 → 02 → 03 → 04 → 05 → 06 → 07.
variables:
  baseUrl: http://localhost:8080
  readerEmail: reader1@example.com
  readerPassword: Password123!
  readerName: Reader One
  reader2Email: reader2@example.com
  reader2Password: Password123!
  reader2Name: Reader Two
  librarianEmail: lib@example.com
  librarianPassword: Password123!
  readerToken: ""
  reader2Token: ""
  librarianToken: ""
  readerId: ""
  reader2Id: ""
  book1Id: ""
  book2Id: ""
  book3Id: ""
  book4Id: ""
  book5Id: ""
  book6Id: ""
  isbnBookId: ""
  loan1Id: ""
  loan2Id: ""
  reservation1Id: ""
