$kind: http-request
url: "{{baseUrl}}/api/loans"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{reader2Token}}
body:
  type: json
  content: '{"book_id":{{book3Id}}}'
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
