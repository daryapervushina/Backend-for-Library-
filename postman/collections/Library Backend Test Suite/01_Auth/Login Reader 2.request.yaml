$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{reader2Email}}","password":"{{reader2Password}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('reader2Token', pm.response.json().token);
    language: text/javascript
order: 4000
