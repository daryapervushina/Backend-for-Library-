$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{readerEmail}}","password":"{{readerPassword}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Token returned', () => pm.expect(b.token).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('readerToken', b.token);
      pm.collectionVariables.set('readerId', b.user.id);
    language: text/javascript
order: 2000
