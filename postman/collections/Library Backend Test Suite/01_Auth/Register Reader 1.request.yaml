$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"{{readerEmail}}","password":"{{readerPassword}}","name":"{{readerName}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Role is READER', () => pm.expect(b.role).to.eql('READER'));
      pm.collectionVariables.set('readerId', b.id);
    language: text/javascript
order: 1000
