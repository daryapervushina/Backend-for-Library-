$kind: http-request
url: "{{baseUrl}}/api/books"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{librarianToken}}
body:
  type: json
  content: '{"isbn":"9780547928227","total_copies":1}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Book created or external API unavailable', () => {
        pm.expect(pm.response.code).to.be.oneOf([200, 409, 503]);
      });
      if (pm.response.code === 200) {
        const b = pm.response.json();
        pm.test('Title from OpenLibrary', () => pm.expect(b.title).to.be.a('string').and.not.empty);
        pm.test('Authors non-empty', () => pm.expect(b.authors).to.be.an('array').and.not.empty);
        pm.collectionVariables.set('isbnBookId', b.id);
      }
    language: text/javascript
order: 3000
