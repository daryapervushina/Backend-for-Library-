$kind: http-request
name: POST book with unknown ISBN → 404/503
url: "{{baseUrl}}/api/books"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{librarianToken}}
body:
  type: json
  content: '{"isbn":"9789999999999","total_copies":1}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Unknown ISBN or external API unavailable', () => {
        pm.expect(pm.response.code).to.be.oneOf([404, 503]);
      });
    language: text/javascript
order: 4000
